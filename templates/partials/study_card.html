<div id="studyCardContainer" class="study-card-container" style="touch-action: pan-y;">
    <div id="studyCard" class="flip-card mx-auto" style="max-width: 600px;">
        <div class="flip-card-inner">
            <!-- Front of study card -->
            <div id="studyCardFront" class="flip-card-front" onclick="flipStudyCard()">
                <div class="text-center">
                    <div class="text-lg font-medium mb-4 opacity-80">Question</div>
                    <div id="studyQuestion" class="text-2xl font-semibold mb-6"></div>
                    <div class="text-sm opacity-70">Click to reveal answer</div>
                </div>
            </div>
            
            <!-- Back of study card -->
            <div id="studyCardBack" class="flip-card-back">
                <div class="text-center w-full">
                    <div class="text-lg font-medium mb-4 opacity-80">Answer</div>
                    <div id="studyAnswer" class="text-2xl font-semibold mb-6"></div>
                    <div class="score-btns">
                        <button onclick="window.flashcardStudy.scoreCard('still-learning')" class="score-btn score-btn--learning">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            Still learning
                        </button>
                        <button onclick="window.flashcardStudy.scoreCard('got-it')" class="score-btn score-btn--got-it">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            Got it!
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
