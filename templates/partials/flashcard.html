<div class="flip-card" data-card-id="{{ card.id }}">
    <div class="flip-card-inner">
        <div class="flip-card-front" onclick="flipCard(this.parentElement.parentElement)">
            <button onclick="event.stopPropagation(); toggleFavorite({{ flashcard_set.id }}, {{ card.id }}, this)"
                    class="favorite-btn {% if card.favorite %}text-yellow-400{% else %}text-white opacity-60{% endif %}">
                <svg class="w-5 h-5 {% if card.favorite %}fill-current{% else %}fill-none stroke-current{% endif %}" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
            </button>
            <div>
                <h3 class="text-sm font-semibold mb-2 opacity-80 uppercase tracking-wider">Question</h3>
                <p class="text-lg font-medium">{{ card.question }}</p>
                <p class="text-xs mt-4 opacity-60">Click to flip</p>
            </div>
        </div>

        <div class="flip-card-back" onclick="flipCard(this.parentElement.parentElement)">
            <div class="flip-card-actions">
                <a href="{{ url_for('edit_card', set_id=flashcard_set.id, card_id=card.id) }}"
                   onclick="event.stopPropagation()"
                   class="flip-action-btn" title="Edit">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                    </svg>
                </a>
                <button onclick="deleteCard(event, {{ flashcard_set.id }}, {{ card.id }})"
                        class="flip-action-btn flip-action-btn--danger" title="Delete">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>
            <div>
                <h3 class="text-sm font-semibold mb-2 opacity-80 uppercase tracking-wider">Answer</h3>
                <p class="text-lg font-medium">{{ card.answer }}</p>
                <p class="text-xs mt-4 opacity-60">Click to flip back</p>
            </div>
        </div>
    </div>
</div>
