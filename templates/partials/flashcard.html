<div class="flip-card" data-card-id="{{ card.id }}">
    <div class="flip-card-inner">
        <div class="flip-card-front" onclick="flipCard(this.parentElement.parentElement)">
            <button onclick="event.stopPropagation(); toggleFavorite({{ flashcard_set.id }}, {{ card.id }}, this)"
                    class="favorite-btn {% if card.favorite %}text-yellow-400{% else %}text-white opacity-60{% endif %}">
                <svg class="w-5 h-5 {% if card.favorite %}fill-current{% else %}fill-none stroke-current{% endif %}" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
            </button>
            <div>
                <h3 class="text-sm font-semibold mb-2 opacity-80 uppercase tracking-wider">Question</h3>
                <p class="text-lg font-medium">{{ card.question }}</p>
                <p class="text-xs mt-4 opacity-60">Click to flip</p>
            </div>
        </div>

        <div class="flip-card-back">
            <div>
                <h3 class="text-sm font-semibold mb-2 opacity-80 uppercase tracking-wider">Answer</h3>
                <p class="text-lg font-medium mb-4">{{ card.answer }}</p>
                <div class="flex justify-center space-x-2">
                    <button onclick="flipCardBack(this)" class="btn btn-secondary text-xs px-3 py-1">
                        Flip back
                    </button>
                    <a href="{{ url_for('edit_card', set_id=flashcard_set.id, card_id=card.id) }}"
                       onclick="event.stopPropagation()"
                       class="btn text-xs px-3 py-1">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit
                    </a>
                    <button onclick="deleteCard(event, {{ flashcard_set.id }}, {{ card.id }})"
                            class="btn btn-danger text-xs px-3 py-1">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
